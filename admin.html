<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Maqsood Marble Polish</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: #fff;
        }

        .admin-container {
            width: 90%;
            max-width: 900px;
            margin: 60px auto;
        }

        h1 {
            text-align: center;
            color: #c9a227;
            margin-bottom: 40px;
        }

        .login-box,
        .reviews-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: #0b0b0b;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 13px 22px;
            background: #c9a227;
            color: #111;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #fff;
        }

        .review-card {
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .review-card h3 {
            margin-top: 0;
        }

        .stars {
            color: #c9a227;
            font-size: 22px;
            margin: 10px 0;
        }

        .review-message {
            color: #ccc;
            line-height: 1.6;
        }

        .approve-btn {
            background: #c9a227;
            margin-top: 15px;
        }

        #adminPanel {
            display: none;
        }

        .logout {
            float: right;
            background: #333;
            color: #fff;
        }
    </style>
</head>

<body>

<div class="admin-container">

    <h1>Maqsood Marble Polish<br>Admin Panel</h1>

    <!-- LOGIN -->
    <div id="loginBox" class="login-box">

        <h2>Admin Login</h2>

        <input
            type="email"
            id="adminEmail"
            placeholder="Admin Email"
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Password"
        >

        <button id="loginBtn">
            Login
        </button>

    </div>


    <!-- ADMIN PANEL -->
    <div id="adminPanel">

        <button class="logout" id="logoutBtn">
            Logout
        </button>

        <div class="reviews-box">

            <h2>Pending Reviews</h2>

            <div id="reviewsList">
                Loading reviews...
            </div>

        </div>

    </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    where,
    doc,
    updateDoc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyA9A2yUG77oFo-kdMRW5uDQNbg_p3nHcLI",

    authDomain:
        "maqsood-marble-polish.firebaseapp.com",

    projectId:
        "maqsood-marble-polish",

    storageBucket:
        "maqsood-marble-polish.firebasestorage.app",

    messagingSenderId:
        "492145901914",

    appId:
        "1:492145901914:web:0fbc59efb0af06c744b363"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


// LOGIN
document.getElementById("loginBtn").addEventListener("click", async () => {

    const email =
        document.getElementById("adminEmail").value.trim();

    const password =
        document.getElementById("adminPassword").value;

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    } catch (error) {

        alert("Login failed: " + error.message);

    }

});


// CHECK LOGIN
onAuthStateChanged(auth, (user) => {

    if (user) {

        document.getElementById("loginBox").style.display = "none";

        document.getElementById("adminPanel").style.display = "block";

        loadReviews();

    } else {

        document.getElementById("loginBox").style.display = "block";

        document.getElementById("adminPanel").style.display = "none";

    }

});


// LOAD PENDING REVIEWS
async function loadReviews() {

    const reviewsList =
        document.getElementById("reviewsList");

    reviewsList.innerHTML = "Loading reviews...";

    try {

        const q = query(
            collection(db, "reviews"),
            where("approved", "==", false)
        );

        const snapshot = await getDocs(q);

        reviewsList.innerHTML = "";

        if (snapshot.empty) {

            reviewsList.innerHTML =
                "<p>No pending reviews.</p>";

            return;
        }

        snapshot.forEach((reviewDoc) => {

            const review = reviewDoc.data();

            const card = document.createElement("div");

            card.className = "review-card";

            card.innerHTML = `
                <h3>${review.name}</h3>

                <div class="stars">
                    ${"★".repeat(review.rating)}
                    ${"☆".repeat(5 - review.rating)}
                </div>

                <p class="review-message">
                    ${review.message}
                </p>

                <button class="approve-btn">
                    Approve Review
                </button>
            `;

            const approveButton =
                card.querySelector(".approve-btn");

            approveButton.addEventListener("click", async () => {

                try {

                    await updateDoc(
                        doc(db, "reviews", reviewDoc.id),
                        {
                            approved: true
                        }
                    );

                    alert("Review approved successfully!");

                    card.remove();

                } catch (error) {

                    alert(
                        "Approval failed: " +
                        error.message
                    );

                }

            });

            reviewsList.appendChild(card);

        });

    } catch (error) {

        reviewsList.innerHTML =
            "<p>Could not load reviews.</p>";

        console.error(error);

    }

}


// LOGOUT
document.getElementById("logoutBtn").addEventListener("click", () => {

    signOut(auth);

});

</script>

</body>
</html>
